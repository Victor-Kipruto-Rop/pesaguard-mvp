      - ./docker-compose.mock-scripts:/scripts:ro
    environment:
      - MOCK_SERVICE_NAME=reports
      - MOCK_SERVICE_PORT=8080
    command: ["python3", "/scripts/mock-server.py"]

  audit-service:
