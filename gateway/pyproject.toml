[project]
name = "pesaguard-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<0.116", "starlette>=0.40,<0.47", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0", "asyncpg>=0.29,<1.0", "redis>=5.0,<7.0", "httpx>=0.27,<1.0",
  "structlog>=24.4,<26.0", "prometheus-client>=0.21,<1.0", "PyJWT>=2.9,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
