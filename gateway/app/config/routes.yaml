version: v1
services:
  - name: auth
    env_var: PESAGUARD_AUTH_SERVICE_URL
    path_prefix: /api/v1/{service}
    health_path: /health
    health_method: GET
    methods: [GET, POST]
  - name: organizations
    env_var: PESAGUARD_ORGANIZATIONS_SERVICE_URL
    path_prefix: /api/v1/{service}
    health_path: /ready
    health_method: GET
    methods: [GET, POST, PUT, PATCH, DELETE]
  - name: merchants
    env_var: PESAGUARD_MERCHANTS_SERVICE_URL
    path_prefix: /api/v1/{service}
    health_path: /health
    health_method: GET
