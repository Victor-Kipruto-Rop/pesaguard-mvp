apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-restrict-ingress
  namespace: pesaguard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pesaguard-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports: [{ protocol: TCP, port: 8000 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - podSelector: {}
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 6379 }, { protocol: TCP, port: 5432 }, { protocol: TCP, port: 443 }]
