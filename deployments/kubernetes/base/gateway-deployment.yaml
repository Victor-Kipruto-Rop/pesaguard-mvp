apiVersion: apps/v1
kind: Deployment
metadata:
  name: pesaguard-gateway
  labels:
    app.kubernetes.io/name: pesaguard-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pesaguard-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pesaguard-gateway
    spec:
      containers:
        - name: gateway
          image: pesaguard/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
          env:
            - name: PESAGUARD_TLS_ENABLED
              value: "true"
            - name: PESAGUARD_TLS_CA_FILE
              value: /etc/pesaguard/tls/ca.crt
            - name: PESAGUARD_TLS_CERT_FILE
              value: /etc/pesaguard/tls/tls.crt
            - name: PESAGUARD_TLS_KEY_FILE
              value: /etc/pesaguard/tls/tls.key
          volumeMounts:
            - name: tls
              mountPath: /etc/pesaguard/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pesaguard-gateway-tls
