apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pesaguard-gateway.fullname" . }}
  labels: { app.kubernetes.io/name: {{ include "pesaguard-gateway.name" . }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "pesaguard-gateway.name" . }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "pesaguard-gateway.name" . }} }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: {{ include "pesaguard-gateway.fullname" . }} } }, { secretRef: { name: {{ .Values.secretName }} } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe: { httpGet: { path: /live, port: http }, initialDelaySeconds: 10, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
