{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pesaguard-gateway.fullname" . }}
  annotations: { nginx.ingress.kubernetes.io/proxy-body-size: "1m" }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.host }}], secretName: {{ .Values.ingress.tlsSecretName }} }]
  rules:
    - host: {{ .Values.ingress.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "pesaguard-gateway.fullname" . }}, port: { name: http } } } }] }
{{- end }}
