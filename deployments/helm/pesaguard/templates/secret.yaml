{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: {{ .Values.secretName }} }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: {{ required "externalSecret.secretStoreRef is required" .Values.externalSecret.secretStoreRef }} }
  target: { name: {{ .Values.secretName }}, creationPolicy: Owner }
  data:
{{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
