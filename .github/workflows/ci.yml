name: Gateway CI

on:
  pull_request:
    paths: ["gateway/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["gateway/**", ".github/workflows/ci.yml"]

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install --upgrade pip && pip install -r gateway/requirements.txt ruff
      - run: ruff check gateway/app gateway/tests
      - run: python -m pytest gateway/tests -q
      - run: docker build --tag pesaguard-gateway:${{ github.sha }} gateway
